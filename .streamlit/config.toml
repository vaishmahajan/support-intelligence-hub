[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F0F4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
